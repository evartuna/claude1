{% extends "base.html" %}
{% block title %}새 세션 – QR 출석{% endblock %}
{% block body %}
<div class="page-center">
  <div class="card">
    <div class="card-header">
      <a href="{{ url_for('dashboard') }}" class="back-link">← 대시보드</a>
      <h2>새 출석 세션 생성</h2>
    </div>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="post" class="form">
      <div class="form-group">
        <label for="class_name">강의명 <span class="required">*</span></label>
        <input id="class_name" name="class_name" type="text"
               placeholder="예) 운영체제 3분반" required />
      </div>
      <div class="form-group">
        <label for="description">메모 (선택)</label>
        <input id="description" name="description" type="text"
               placeholder="예) 중간고사 전 마지막 강의" />
      </div>
      <div class="form-group">
        <label for="expiry_minutes">QR 유효 시간 (분)</label>
        <input id="expiry_minutes" name="expiry_minutes" type="number"
               min="1" max="120" value="{{ default_expiry }}" required />
        <small class="form-hint">QR 코드가 만료되면 학생들이 출석할 수 없습니다.</small>
      </div>
      <div class="form-actions">
        <a href="{{ url_for('dashboard') }}" class="btn btn-ghost">취소</a>
        <button type="submit" class="btn btn-primary">세션 생성 및 QR 보기</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
